<body class="bg-[#080808] text-white antialiased min-h-screen">

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Web Audio API Chime Synthesizer ---
    let audioCtx = null;
    function playChime(tone = 'bell') {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        [587.33, 880, 1174.66, 1760].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          const vol = 0.15 / (idx + 1);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8 - (idx * 0.2));
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 2.0);
        });
      } catch (e) {
        console.warn(e);
      }
    }

    // Asia/Kolkata date helper
    function getKolkataDateString() {
      const formatter = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Kolkata',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      return formatter.format(new Date());
    }

    const todayStr = getKolkataDateString();
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split('T')[0];

    const INITIAL_REMINDERS = [
      {
        id: 'r1',
        title: 'VIP Portfolio & Strategy Briefing',
        description: 'Review milestone deliverables, capital allocations and deployment window for v2.0.',
        dueDate: todayStr,
        dueTime: '11:30',
        priority: 'high',
        category: 'work',
        completed: false,
        tags: ['Strategy', 'VIP']
      },
      {
        id: 'r2',
        title: 'Hydration & Posture Reset',
        description: 'Drink 500ml water and complete 5-minute thoracic spine stretch.',
        dueDate: todayStr,
        dueTime: '14:00',
        priority: 'low',
        category: 'health',
        completed: false,
        tags: ['Wellness', 'Habit']
      },
      {
        id: 'r3',
        title: 'Submit Monthly Financial Accounting',
        description: 'Review invoice approvals and reconcile cloud hosting receipts with business account.',
        dueDate: todayStr,
        dueTime: '17:00',
        priority: 'high',
        category: 'finance',
        completed: false,
        tags: ['Finance', 'Invoices']
      },
      {
        id: 'r4',
        title: 'Deep Work: TypeScript Architecture Study',
        description: 'Read chapters on advanced discriminated unions and performance patterns in modern React.',
        dueDate: tomorrowStr,
        dueTime: '09:00',
        priority: 'medium',
        category: 'study',
        completed: false,
        tags: ['Learning', 'Coding']
      },
      {
        id: 'r5',
        title: 'Morning 20-Min Cardio & HIIT',
        description: 'Completed 3.2km outdoor sprint and core cooldown.',
        dueDate: todayStr,
        dueTime: '07:30',
        priority: 'medium',
        category: 'health',
        completed: true,
        tags: ['Fitness']
      }
    ];

    const INITIAL_NOTIFICATIONS = [
      {
        id: 'n1',
        title: 'Scheduled Alert: VIP Portfolio Briefing',
        message: 'Reminder due at 11:30 AM IST (Asia/Kolkata)',
        timestamp: new Date().toISOString(),
        read: false
      },
      {
        id: 'n2',
        title: 'FCM Push Engine Initialized',
        message: 'Background scheduler active in Asia/Kolkata timezone.',
        timestamp: new Date(Date.now() - 3600000).toISOString(),
        read: true
      }
    ];

    // --- Main App Component ---
    function App() {
      // Login page MUST open first when visiting unauthenticated
      const [user, setUser] = useState(null);
      const [currentPage, setCurrentPage] = useState('login');

      // Login form state
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [loginError, setLoginError] = useState('');

      // Signup form state
      const [signupName, setSignupName] = useState('');
      const [signupEmail, setSignupEmail] = useState('');
      const [signupPassword, setSignupPassword] = useState('');
      const [signupConfirm, setSignupConfirm] = useState('');
      const [signupError, setSignupError] = useState('');
      const [signupSuccess, setSignupSuccess] = useState(false);

      // Forgot Password form state
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotSuccess, setForgotSuccess] = useState(false);

      // Reminders & Notifications
      const [reminders, setReminders] = useState(() => {
        const saved = localStorage.getItem('remember_me_local_reminders');
        return saved ? JSON.parse(saved) : INITIAL_REMINDERS;
      });

      const [notifications, setNotifications] = useState(() => {
        const saved = localStorage.getItem('remember_me_notifications');
        return saved ? JSON.parse(saved) : INITIAL_NOTIFICATIONS;
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [selectedPriority, setSelectedPriority] = useState('all');
      const [modalOpen, setModalOpen] = useState(false);
      const [editingReminder, setEditingReminder] = useState(null);

      // Reminder Modal State
      const [formTitle, setFormTitle] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formDate, setFormDate] = useState(todayStr);
      const [formTime, setFormTime] = useState('10:00');
      const [formPriority, setFormPriority] = useState('medium');
      const [formCategory, setFormCategory] = useState('work');

      useEffect(() => {
        localStorage.setItem('remember_me_local_reminders', JSON.stringify(reminders));
      }, [reminders]);

      useEffect(() => {
        localStorage.setItem('remember_me_notifications', JSON.stringify(notifications));
      }, [notifications]);

      // Login actions
      const handleLogin = (e) => {
        e.preventDefault();
        if (!loginEmail || !loginPassword) {
          setLoginError('Please enter both email and password.');
          return;
        }
        const appUser = {
          displayName: loginEmail.split('@')[0],
          email: loginEmail,
          photoURL: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80'
        };
        setUser(appUser);
        setCurrentPage('dashboard');
      };

      const handleDemoLogin = () => {
        const appUser = {
          displayName: 'Alex Morgan',
          email: 'alex.gold@rememberme.app',
          photoURL: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80'
        };
        setUser(appUser);
        setCurrentPage('dashboard');
      };

      const handleSignup = (e) => {
        e.preventDefault();
        if (!signupName || !signupEmail || !signupPassword) {
          setSignupError('All fields are required.');
          return;
        }
        if (signupPassword !== signupConfirm) {
          setSignupError('Passwords do not match.');
          return;
        }
        setSignupSuccess(true);
        setTimeout(() => {
          setSignupSuccess(false);
          setCurrentPage('login');
        }, 1200);
      };

      const handleLogout = () => {
        setUser(null);
        setCurrentPage('login');
      };

      const toggleComplete = (id) => {
        setReminders(prev => prev.map(r => {
          if (r.id === id) {
            const next = !r.completed;
            if (next && window.confetti) {
              window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 }, colors: ['#D4AF37', '#F5D76E', '#FFFFFF'] });
              playChime('bell');
            }
            return { ...r, completed: next };
          }
          return r;
        }));
      };

      const deleteReminder = (id) => {
        setReminders(prev => prev.filter(r => r.id !== id));
      };

      const openCreateModal = () => {
        setEditingReminder(null);
        setFormTitle('');
        setFormDesc('');
        setFormDate(todayStr);
        setFormTime('10:00');
        setFormPriority('medium');
        setFormCategory('work');
        setModalOpen(true);
      };

      const openEditModal = (r) => {
        setEditingReminder(r);
        setFormTitle(r.title);
        setFormDesc(r.description || '');
        setFormDate(r.dueDate);
        setFormTime(r.dueTime);
        setFormPriority(r.priority);
        setFormCategory(r.category);
        setModalOpen(true);
      };

      const handleSaveReminder = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        if (editingReminder) {
          setReminders(prev => prev.map(r => r.id === editingReminder.id ? {
            ...r,
            title: formTitle.trim(),
            description: formDesc.trim(),
            dueDate: formDate,
            dueTime: formTime,
            priority: formPriority,
            category: formCategory
          } : r));
        } else {
          const newReminder = {
            id: 'rem_' + Date.now(),
            title: formTitle.trim(),
            description: formDesc.trim(),
            dueDate: formDate,
            dueTime: formTime,
            priority: formPriority,
            category: formCategory,
            completed: false,
            tags: [formCategory]
          };
          setReminders(prev => [newReminder, ...prev]);

          // Add notification
          setNotifications(prev => [{
            id: 'n_' + Date.now(),
            title: 'Created: ' + newReminder.title,
            message: `Scheduled for ${newReminder.dueDate} at ${newReminder.dueTime} IST`,
            timestamp: new Date().toISOString(),
            read: false
          }, ...prev]);
        }
        setModalOpen(false);
      };

      // Statistics
      const total = reminders.length;
      const completed = reminders.filter(r => r.completed).length;
      const pending = total - completed;
      const todayDue = reminders.filter(r => !r.completed && r.dueDate === todayStr).length;
      const highPending = reminders.filter(r => !r.completed && r.priority === 'high').length;
      const rate = total > 0 ? Math.round((completed / total) * 100) : 0;
      const unreadNotifs = notifications.filter(n => !n.read).length;

      // Filtered Reminders
      const filteredReminders = reminders.filter(r => {
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          if (!r.title.toLowerCase().includes(q) && !(r.description && r.description.toLowerCase().includes(q))) return false;
        }
        if (selectedCategory !== 'all' && r.category !== selectedCategory) return false;
        if (selectedPriority !== 'all' && r.priority !== selectedPriority) return false;
        return true;
      });

      // ----------------- UNAUTHENTICATED SCREENS -----------------
      if (!user) {
        if (currentPage === 'signup') {
          return (
            <div className="min-h-screen bg-[#080808] flex items-center justify-center p-4">

                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#D4AF37] to-[#F5D76E] text-black font-extrabold flex items-center justify-center mx-auto mb-3 shadow-lg shadow-[#D4AF37]/20">✨</div>
                  <h1 className="text-[26px] font-extrabold text-white">Create VIP Account</h1>
                  <p className="text-[14px] text-[#B8B8B8] mt-1">Join REMEMBER ME – Luxury Smart Planner</p>
                </div>

                {signupSuccess ? (

                  </div>
                ) : (
                  <form onSubmit={handleSignup} className="space-y-3.5">
                    {signupError && <div className="p-2.5 rounded-xl bg-red-950/60 border border-red-700 text-red-300 text-[12px]">{signupError}</div>}
                    <div>
                      <label className="text-[12px] font-semibold text-[#B8B8B8] block mb-1">Full Name</label>
                      <input type="text" required value={signupName} onChange={e=>setSignupName(e.target.value)} placeholder="Alex Morgan" className="w-full px-3.5 py-2 text-[14px] rounded-xl bg-[#141414] border border-[#D4AF37]/30 text-white" />
                    </div>
                    <div>
                      <label className="text-[12px] font-semibold text-[#B8B8B8] block mb-1">Email Address</label>
                      <input type="email" required value={signupEmail} onChange={e=>setSignupEmail(e.target.value)} placeholder="name@rememberme.app" className="w-full px-3.5 py-2 text-[14px] rounded-xl bg-[#141414] border border-[#D4AF37]/30 text-white" />
                    </div>
                    <div>
                      <label className="text-[12px] font-semibold text-[#B8B8B8] block mb-1">Password</label>
                      <input type="password" required value={signupPassword} onChange={e=>setSignupPassword(e.target.value)} placeholder="••••••••" className="w-full px-3.5 py-2 text-[14px] rounded-xl bg-[#141414] border border-[#D4AF37]/30 text-white" />
                    </div>
                    <div>
                      <label className="text-[12px] font-semibold text-[#B8B8B8] block mb-1">Confirm Password</label>
                      <input type="password" required value={signupConfirm} onChange={e=>setSignupConfirm(e.target.value)} placeholder="••••••••" className="w-full px-3.5 py-2 text-[14px] rounded-xl bg-[#141414] border border-[#D4AF37]/30 text-white" />
                    </div>
                    <button type="submit" className="w-full py-3 rounded-xl btn-gold text-black font-bold text-[14px] shadow-lg shadow-[#D4AF37]/20 mt-2">Complete Registration</button>
                    <div className="text-center pt-3 border-t border-[#D4AF37]/20 text-[14px]">
                      <button type="button" onClick={()=>setCurrentPage('login')} className="text-[#F5D76E] hover:underline">Already have an account? Sign In</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          );
        }

        if (currentPage === 'forgot-password') {
          return (
            <div className="min-h-screen bg-[#080808] flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-3xl bg-[#191919] p-8 border border-[#D4AF37]/30 shadow-2xl">
                <div className="text-center mb-6">
                  <h1 className="text-[26px] font-extrabold text-white">Reset Password</h1>
                  <p className="text-[14px] text-[#B8B8B8] mt-1">We will dispatch recovery instructions</p>
                </div>
                {forgotSuccess ? (
                  <div className="text-center py-4">
                    <h3 className="text-[17px] font-bold text-[#F5D76E]">Recovery Link Dispatched</h3>
                    <p className="text-[14px] text-[#B8B8B8] mt-2">Check your email for reset instructions.</p>
                    <button onClick={()=>setCurrentPage('login')} className="mt-4 px-4 py-2 rounded-xl btn-gold text-black font-bold text-[14px]">Back to Sign In</button>
                  </div>
                ) : (
                  <form onSubmit={(e)=>{e.preventDefault(); setForgotSuccess(true);}} className="space-y-4">
                    <input type="email" required value={forgotEmail} onChange={e=>setForgotEmail(e.target.value)} placeholder="name@rememberme.app" className="w-full px-3.5 py-2.5 text-[14px] rounded-xl bg-[#141414] border border-[#D4AF37]/30 text-white" />
                    <button type="submit" className="w-full py-3 rounded-xl btn-gold text-black font-bold text-[14px]">Send Reset Link</button>
                    <div className="text-center pt-2">
                      <button type="button" onClick={()=>setCurrentPage('login')} className="text-[14px] text-[#F5D76E] hover:underline">← Back to Sign In</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          );
        }

        if (currentPage === 'landing') {
          return (
            <div className="min-h-screen bg-[#080808] text-white p-8 max-w-5xl mx-auto">
              <div className="flex justify-between items-center pb-6 border-b border-[#D4AF37]/20">
                <h1 className="text-[26px] font-extrabold text-white">REMEMBER ME</h1>
                <div className="flex gap-3">
                  <button onClick={()=>setCurrentPage('login')} className="px-4 py-2 rounded-xl bg-[#222222] text-[#F5D76E] text-[14px] font-bold border border-[#D4AF37]/30">Sign In</button>
                  <button onClick={()=>setCurrentPage('signup')} className="px-4 py-2 rounded-xl btn-gold text-black text-[14px] font-bold">Get Started</button>
                </div>
              </div>
              <div className="py-20 text-center">
                <h2 className="text-[26px] sm:text-[34px] font-extrabold bg-gradient-to-r from-white via-[#F5D76E] to-[#D4AF37] bg-clip-text text-transparent">
                  Never Forget What Matters. Master Your Time in Luxury.
                </h2>
                <p className="text-[14px] text-[#B8B8B8] max-w-xl mx-auto mt-4">
                  Luxury Black & Gold executive reminder suite with Asia/Kolkata timezone support, audio chimes, and Firebase Cloud sync.
                </p>
                <div className="mt-8 flex justify-center gap-4">
                  <button onClick={()=>setCurrentPage('login')} className="px-6 py-3 rounded-xl btn-gold text-black font-bold text-[14px]">Enter Member Portal</button>
                  <button onClick={handleDemoLogin} className="px-6 py-3 rounded-xl bg-[#191919] border border-[#D4AF37]/40 text-[#F5D76E] font-bold text-[14px]">1-Click VIP Demo</button>
                </div>
              </div>
            </div>
          );
        }

        // DEFAULT SCREEN: Login Page (Prompt Requirement: "Login page must open first")
        return (
          <div className="min-h-screen bg-[#080808] flex items-center justify-center p-4">
            <div className="w-full max-w-md rounded-3xl bg-[#191919] p-8 border border-[#D4AF37]/35 shadow-2xl">
              <div className="text-center mb-6">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#D4AF37] to-[#F5D76E] text-black font-extrabold flex items-center justify-center mx-auto mb-3 shadow-lg shadow-[#D4AF37]/25">✨</div>
                <h1 className="text-[26px] font-extrabold bg-gradient-to-r from-white via-[#F5D76E] to-[#D4AF37] bg-clip-text text-transparent">REMEMBER ME</h1>
                <p className="text-[14px] text-[#B8B8B8] mt-1">Sign in to access your luxury smart planner</p>
              </div>

              {loginError && <div className="mb-4 p-3 rounded-xl bg-red-950/60 border border-red-700 text-red-300 text-[12px]">{loginError}</div>}

              <button
                type="button"
                onClick={handleDemoLogin}
                className="w-full py-2.5 px-4 rounded-xl bg-[#222222] hover:bg-[#2A2A2A] border border-[#D4AF37]/40 text-[#F5D76E] text-[14px] font-bold shadow-sm transition-all mb-4"
              >
                ⚡ 1-Click VIP Demo Access (No Password)
              </button>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="text-[12px] font-semibold text-[#B8B8B8] block mb-1">Email Address</label>
                  <input type="email" required value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} placeholder="name@rememberme.app" className="w-full px-3.5 py-2.5 text-[14px] rounded-xl bg-[#141414] border border-[#D4AF37]/30 text-white" />
                </div>
                <div>
                  <div className="flex justify-between mb-1">
                    <label className="text-[12px] font-semibold text-[#B8B8B8]">Password</label>
                    <button type="button" onClick={()=>setCurrentPage('forgot-password')} className="text-[12px] text-[#F5D76E] hover:underline">Forgot password?</button>
                  </div>
                  <div className="relative">
                    <input type={showLoginPassword ? "text" : "password"} required value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} placeholder="••••••••" className="w-full px-3.5 py-2.5 text-[14px] rounded-xl bg-[#141414] border border-[#D4AF37]/30 text-white pr-10" />
                    <button type="button" onClick={()=>setShowLoginPassword(!showLoginPassword)} className="absolute right-3 top-2.5 text-[12px] text-[#B8B8B8]">
                      {showLoginPassword ? "Hide" : "Show"}
                    </button>
                  </div>
                </div>

                <button type="submit" className="w-full py-3 rounded-xl btn-gold text-black font-bold text-[14px] shadow-lg shadow-[#D4AF37]/25">
                  Sign In to Dashboard

                        <option value="health">Health</option>
                        <option value="finance">Finance</option>
                        <option value="study">Study</option>
                      </select>
                    </div>
                  </div>
                  <div className="pt-3 border-t border-[#D4AF37]/20 flex justify-end gap-2">
                    <button type="button" onClick={() => setModalOpen(false)} className="px-3 py-1.5 text-[14px] text-[#B8B8B8]">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl btn-gold text-black font-bold text-[14px]">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
